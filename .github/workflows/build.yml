name: build

on: [workflow_dispatch]

jobs:
  windows-msys:
    name: ${{ matrix.config }} Windows ${{ matrix.arch }} ${{ matrix.type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        cc: [gcc]
        type: [Debug, Release]
        include:
          # - arch: x86
          #   msystem: MINGW32
          #   prefix: mingw-w64-i686

          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        install: base-devel ${{ matrix.prefix }}-toolchain ${{ matrix.prefix }}-cmake ${{ matrix.prefix }}-ninja ${{ matrix.prefix }}-qt6-base ${{ matrix.prefix }}-qt6-svg ${{ matrix.prefix }}-libxml2 git unzip p7zip
        msystem: ${{ matrix.msystem }}
        path-type: minimal
        release: false
        update: false

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -S. --preset DefaultNinja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DMINGW=TRUE -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build --preset DefaultNinja --target install
        mkdir -p install/settings
        touch install/settings/.gitkeep

    - name: Deploy
      run: |
        windeployqt install/radiant.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WifeRadiant-${{ github.sha }}-Windows-${{ matrix.arch }}-${{ matrix.type }}
        path: install/*
        if-no-files-found: error

  linux:
    name: ${{ matrix.config }} Linux ${{ matrix.arch }} ${{ matrix.type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        type: [Debug, Release]

    steps:
    - name: Install Dependencies
      run: |
          sudo apt-get -qq update
          sudo apt-get -y install mesa-common-dev
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -S. --preset DefaultNinja -DCMAKE_BUILD_TYPE=${{ matrix.type }}

    - name: Build
      run: |
        cmake --build --preset DefaultNinja
        mkdir -p install/settings
        touch install/settings/.gitkeep

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WifeRadiant-${{ github.sha }}-Linux-${{ matrix.arch }}-${{ matrix.type }}
        path: install/*
        if-no-files-found: error

  macos:
    name: ${{ matrix.config }} MacOS ${{ matrix.arch }} ${{ matrix.type }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        type: [Debug, Release]

    steps:
    - name: Install Dependencies
      run: brew install qt

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: |
        cmake -S. --preset DefaultNinja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DRADIANT_BUILD_Q2MAP=OFF -DRADIANT_BUILD_H2DATA=OFF -DRADIANT_BUILD_QDATA3=OFF

    - name: Build
      run: |
        cmake --build --preset DefaultNinja --target install
        mkdir -p install/settings
        touch install/settings/.gitkeep

    - name: Deploy
      run: |
        macdeployqt install/WifeRadiant.app

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WifeRadiant-${{ github.sha }}-MacOS-${{ matrix.arch }}-${{ matrix.type }}
        path: install/*
        if-no-files-found: error
